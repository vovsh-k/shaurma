<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шаурма зовёт 🌯</title>
<style>
:root {
  --accent: #e07b2a;
  --accent-soft: #f5d9b8;
  --cream: #fff8ef;
  --ink: #4a3b2e;
  --card: #fffdf9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: Georgia, 'Times New Roman', serif;
  color: var(--ink);
  background: linear-gradient(160deg, #fff1dc 0%, #ffe8cc 50%, #ffd9b8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 48px;
  overflow-x: hidden;
  position: relative;
}
.bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.bg span {
  position: absolute;
  bottom: -60px;
  opacity: 0;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  10% { opacity: .55; }
  90% { opacity: .4; }
  100% { transform: translateY(-115vh) rotate(20deg); opacity: 0; }
}
.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  background: var(--card);
  border-radius: 26px;
  box-shadow: 0 18px 50px rgba(224, 123, 42, .25);
  padding: 40px 28px 34px;
  text-align: center;
}
.page { display: none; }
.page.active { display: block; animation: pageIn .38s ease; }
@keyframes pageIn {
  0% { transform: scale(.92); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.stamp { font-size: 56px; line-height: 1; }
h1 {
  font-size: 28px;
  font-weight: normal;
  margin: 16px 0 10px;
  color: var(--accent);
}
.step-label {
  font-size: 13px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #b08a63;
  margin: 22px 0 10px;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip {
  font-family: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--cream);
  border: 1.5px solid var(--accent-soft);
  border-radius: 999px;
  padding: 9px 15px;
  cursor: pointer;
  transition: all .18s ease;
}
.chip:hover { border-color: var(--accent); transform: translateY(-1px); }
.chip.selected {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 6px 16px rgba(224, 123, 42, .35);
}
.chip small { display: block; font-size: 11.5px; opacity: .75; margin-top: 2px; }
input[type=text] {
  font-family: inherit;
  font-size: 15px;
  color: var(--ink);
  width: 100%;
  margin-top: 12px;
  padding: 11px 14px;
  border: 1.5px solid var(--accent-soft);
  border-radius: 14px;
  background: var(--cream);
  outline: none;
}
input[type=text]:focus { border-color: var(--accent); }
.cta-row { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: 26px; }
.cta {
  font-family: inherit;
  font-size: 19px;
  color: #fff;
  background: linear-gradient(135deg, #f0923f, #e06a1f);
  border: none;
  border-radius: 999px;
  padding: 16px 30px;
  cursor: pointer;
  box-shadow: 0 10px 24px rgba(224, 106, 31, .4);
  transition: all .18s ease;
  width: 100%;
}
.cta:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(224, 106, 31, .5); }
.cta:disabled { opacity: .5; cursor: default; box-shadow: none; }
.dodge {
  font-family: inherit;
  font-size: 14px;
  color: #b08a63;
  background: var(--card);
  border: 1.5px dashed var(--accent-soft);
  border-radius: 999px;
  padding: 8px 18px;
  cursor: pointer;
  position: relative;
  transition: left .22s ease, top .22s ease;
}
.hint { font-size: 13px; color: #b08a63; margin-top: 16px; min-height: 18px; }
.error { color: #c0392b; font-size: 14px; margin-top: 12px; }
.hidden { display: none !important; }
.confetti {
  position: fixed;
  top: -40px;
  font-size: 26px;
  z-index: 5;
  pointer-events: none;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(115vh) rotate(340deg); opacity: .2; }
}
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<div class="card">
  <section class="page active" id="pageAsk">
    <div class="stamp">🌯</div>
    <h1>Погнали за шаурмой?</h1>

    <div class="step-label">Выбери день</div>
    <div class="chips" id="dayChips"></div>

    <div class="step-label">Примерное время</div>
    <div class="chips" id="timeChips"></div>
    <input type="text" id="customTime" class="hidden" maxlength="60" placeholder="Напиши, как тебе удобно, например «после 19:00»">

    <div class="cta-row">
      <button class="cta" id="yesBtn" disabled>Погнали 🌯</button>
      <button class="dodge" id="dodgeBtn">Нет 🙈</button>
    </div>
    <div class="hint" id="hint">Выбери день и время — кнопка оживёт 😎</div>
    <div class="error hidden" id="errorBox"></div>
  </section>

  <section class="page" id="pageDone">
    <div class="stamp">🎉</div>
    <h1>Ура!</h1>
    <p class="lead" id="doneText" style="font-size:17px;line-height:1.55;margin-bottom:12px;"></p>
    <p style="font-size:17px;line-height:1.55;">Шаурма уже ждёт. До встречи! 🌯😋</p>
  </section>
</div>

<script>
const CONFIG = {
  botToken: '9080353860:AAFde8BfqS8aWib-ZPYTlzz4IiL_IX9le2I',
  chatId: '949424589'
};

const DAYS = [
  { label: 'Среда', date: '25 ноября', value: 'ср, 25 ноября' },
  { label: 'Четверг', date: '26 ноября', value: 'чт, 26 ноября' },
  { label: 'Пятница', date: '27 ноября', value: 'пт, 27 ноября' },
  { label: 'Суббота', date: '28 ноября', value: 'сб, 28 ноября' },
  { label: 'Воскресенье', date: '29 ноября', value: 'вс, 29 ноября' }
];
const TIME_SLOTS = [
  { id: 'morning', label: 'Утро ☀️', sub: '10:00–12:00' },
  { id: 'day', label: 'День 🌤', sub: '12:00–17:00' },
  { id: 'evening', label: 'Вечер 🌙', sub: '17:00–21:00' },
  { id: 'custom', label: 'Свой вариант ✏️', sub: '' }
];
const DODGE_LABELS = ['Нет 🙈', 'Неа 🙅‍♀️', 'Не хочу 😝', 'Мимо 😌', 'Даже не проси 🥺', 'Ну уж нет 😤'];

const state = { day: null, time: null };

function buildDays() {
  const wrap = document.getElementById('dayChips');
  DAYS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.innerHTML = d.label + '<small>' + d.date + '</small>';
    btn.addEventListener('click', () => {
      wrap.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      state.day = d.value;
      refresh();
    });
    wrap.appendChild(btn);
  });
}

function buildTimes() {
  const wrap = document.getElementById('timeChips');
  TIME_SLOTS.forEach(slot => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.innerHTML = slot.label + (slot.sub ? '<small>' + slot.sub + '</small>' : '');
    btn.addEventListener('click', () => {
      wrap.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      state.time = slot.id;
      document.getElementById('customTime').classList.toggle('hidden', slot.id !== 'custom');
      refresh();
    });
    wrap.appendChild(btn);
  });
}

function timeText() {
  if (state.time === 'custom') return document.getElementById('customTime').value.trim();
  const slot = TIME_SLOTS.find(s => s.id === state.time);
  return slot ? slot.label + ' (' + slot.sub + ')' : '';
}

function refresh() {
  const ok = state.day && state.time && (state.time !== 'custom' || document.getElementById('customTime').value.trim());
  document.getElementById('yesBtn').disabled = !ok;
  document.getElementById('hint').textContent = ok ? 'Отлично! Осталось нажать «Погнали» 😎' : 'Выбери день и время — кнопка оживёт 😎';
}

function spawnBg() {
  const bg = document.getElementById('bg');
  const emojis = ['🌯', '🍟', '🥤'];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('span');
    s.textContent = emojis[i % emojis.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = 24 + Math.random() * 22 + 'px';
    s.style.animationDuration = 8 + Math.random() * 9 + 's';
    s.style.animationDelay = Math.random() * 14 + 's';
    bg.appendChild(s);
  }
}

function confetti() {
  const emojis = ['🌯', '🍟', '🎉', '✨', '😋'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = emojis[i % emojis.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 2.2 + Math.random() * 2.5 + 's';
    s.style.animationDelay = Math.random() * 0.8 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6000);
  }
}

async function sendToTelegram(text) {
  if (!CONFIG.botToken || !CONFIG.chatId) return true;
  const res = await fetch('https://api.telegram.org/bot' + CONFIG.botToken + '/sendMessage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: CONFIG.chatId, text: text })
  });
  const data = await res.json();
  return data.ok === true;
}

async function submit() {
  const btn = document.getElementById('yesBtn');
  const err = document.getElementById('errorBox');
  btn.disabled = true;
  btn.textContent = 'Отправляю… 🌯';
  err.classList.add('hidden');
  const when = state.day + ' · ' + timeText();
  try {
    const ok = await sendToTelegram('🌯 ШАУРМА-ПРИГЛАШЕНИЕ\nОна сказала да! 😋\nКогда: ' + when);
    if (!ok) throw new Error('telegram');
    document.getElementById('doneText').textContent = 'Шаурма ' + when + ' — уже в моём календаре.';
    document.getElementById('pageAsk').classList.remove('active');
    document.getElementById('pageDone').classList.add('active');
    document.getElementById('dodgeBtn').classList.add('hidden');
    confetti();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Погнали 🌯';
    err.textContent = 'Не получилось отправить 😢 Попробуй ещё разок';
    err.classList.remove('hidden');
  }
}

function initDodge() {
  const btn = document.getElementById('dodgeBtn');
  let count = 0;
  let placed = false;
  const place = (x, y) => {
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
  };
  const move = () => {
    count++;
    btn.textContent = DODGE_LABELS[count % DODGE_LABELS.length];
    if (!placed) {
      btn.style.position = 'fixed';
      btn.style.zIndex = 10;
      placed = true;
    }
    const w = btn.offsetWidth;
    const h = btn.offsetHeight;
    place(
      8 + Math.random() * Math.max(1, window.innerWidth - w - 16),
      8 + Math.random() * Math.max(1, window.innerHeight - h - 16)
    );
  };
  btn.addEventListener('pointerenter', move);
  btn.addEventListener('click', move);
  window.addEventListener('resize', () => {
    if (!placed) return;
    const x = Math.min(parseFloat(btn.style.left) || 0, window.innerWidth - btn.offsetWidth - 8);
    const y = Math.min(parseFloat(btn.style.top) || 0, window.innerHeight - btn.offsetHeight - 8);
    place(Math.max(8, x), Math.max(8, y));
  });
}

document.getElementById('customTime').addEventListener('input', refresh);
document.getElementById('yesBtn').addEventListener('click', submit);
buildDays();
buildTimes();
spawnBg();
initDodge();
</script>
</body>
</html>
